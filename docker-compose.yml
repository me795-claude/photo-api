# Запуск сервиса:          docker compose up -d --build     → http://localhost:8000
# Прогон тестового набора: docker compose run --rm testset
# Без настоящей LLM:       docker compose --profile mock up -d mock-llm
#                          (и в .env: OPENWEBUI_URL=http://mock-llm:3000)

x-app: &app
  build: .
  image: photo-api:latest
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"   # доступ к Open WebUI на хост-машине (Linux)

services:
  photo-check:
    <<: *app
    container_name: photo-check
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

  testset:
    <<: *app
    profiles: ["test"]
    command: ["python", "-m", "app.cli", "testset", "--dir", "/app/testset", "--out", "/app/results/report.json"]
    volumes:
      - ./testset:/app/testset:ro
      - ./results:/app/results

  mock-llm:
    <<: *app
    profiles: ["mock"]
    container_name: mock-llm
    command: ["uvicorn", "app.mock_llm:app", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    healthcheck:
      disable: true
